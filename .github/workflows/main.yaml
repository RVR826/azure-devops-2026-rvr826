name: Project Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Test
      run: dotnet test --verbosity normal
  
  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Publish API 
      run: dotnet publish Votex.API -c Release -o ./publish-api

    - name: Upload API artifact 
      uses: actions/upload-artifact@v4 
      with: 
        name: api-publish
        path: ./publish-api

    - name: Publish Blazor 
      run: dotnet publish Votex.Blazor -c Release -o ./publish-blazor

    - name: Upload Blazor artifact 
      uses: actions/upload-artifact@v4 
      with: 
        name: blazor-publish
        path: ./publish-blazor

  deploy-infra:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infrastructure w/ Bicep
        run: |
          az deployment group create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_NAME }} \
            --template-file Infrastructure/main.bicep \
            --parameters \
              sqlServerName=${{ secrets.SQL_SERVER_NAME }} \
              sqlAdminUser=${{ secrets.SQL_SERVER_ADMIN_USER }} \
              sqlAdminPassword=${{ secrets.SQL_SERVER_ADMIN_PASSWORD }} \
              databaseName=${{ secrets.SQL_SERVER_DATABASE }} \
              appServiceName=${{ secrets.APP_SERVICE_NAME }} \
              apiServiceName=${{ secrets.API_SERVICE_NAME }} \
              frontendServiceName=${{ secrets.FRONTEND_SERVICE_NAME }}

  deploy-api:
    runs-on: ubuntu-latest
    needs: deploy-infra

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: ./publish-api

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.API_SERVICE_NAME }}
          package: ./publish-api