name: Project Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Test
      run: dotnet test --verbosity normal
  
  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Publish app 
      run: dotnet publish -c Release -o ./publish 

    - name: Upload artifact 
      uses: actions/upload-artifact@v4 
      with: 
        name: app-publis 
        path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_NAME }} \
            --template-file infra/main.bicep \
            --parameters \
              sqlServerName=${{ secrets.SQL_SERVER_NAME }} \
              sqlAdminUser=${{ secrets.SQL_SERVER_ADMIN_USER }} \
              sqlAdminPassword=${{ secrets.SQL_SERVER_ADMIN_PASSWORD }} \
              databaseName=${{ secrets.SQL_SERVER_DATABASE }} \
              appServiceName=${{ secrets.APP_SERVICE_NAME }}
